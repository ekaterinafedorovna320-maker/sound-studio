<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Studio Time - SoundStudio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <nav class="header-container">
      <a href="index.html" class="logo">
        <svg class="logo-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M2 10v4M6 6v12M10 3v18M14 8v8M18 5v14M22 10v4"/>
        </svg>
        <span>SoundStudio</span>
      </a>
      
      <a href="tel:+77001234567" class="header-phone">+7 (700) 123-4567</a>

      <input type="checkbox" id="burger-toggle" class="burger-toggle">
      <label for="burger-toggle" class="burger-button">
        <span></span><span></span><span></span>
      </label>

      <ul class="main-nav">
        <li><a href="index.html">Home</a></li>
        <li><a href="equipment.html">Equipment</a></li>
        <li><a href="services.html">Services & Prices</a></li>
        <li><a href="work.html">Our Works</a></li>
        <li><a href="booking.html" class="active">Book Now</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="booking-section">
      <h2 style="text-align: center; margin-bottom: 2rem; color: var(--primary-color);">Reserve Studio Time</h2>
      <form class="booking-form" action="#" method="POST">
        
        <article class="form-group">
          <label for="name">Full Name *</label>
          <input type="text" id="name" name="name" placeholder="John Doe" required>
        </article>

        <article class="form-group">
          <label for="email">Email *</label>
          <input type="email" id="email" name="email" placeholder="example@mail.com" required>
        </article>

        <article class="form-group">
          <label for="phone">Phone Number *</label>
          <input type="tel" id="phone" name="phone" placeholder="+77001234567" pattern="[+0-9]{10,15}" required>
        </article>

        <article class="form-group">
          <label for="service">Service Type *</label>
          <select id="service" name="service" required>
            <option value="vocal">Vocal Recording ($40/hr)</option>
            <option value="mixing">Track Mixing ($150/track)</option>
            <option value="podcast">Turnkey Podcast ($80/hr)</option>
          </select>
        </article>

        <article class="form-group">
          <label for="date">Booking Date *</label>
          <input type="date" id="date" name="date" required>
        </article>

        <article class="form-group">
          <label for="duration">Session Duration (Hours) *</label>
          <input type="number" id="duration" name="duration" min="1" max="12" value="2" required>
        </article>

        <article class="form-group checkbox-group">
          <input type="checkbox" id="engineer" name="engineer">
          <label for="engineer">Include Sound Engineer ($20/hr)</label>
        </article>

        <button type="submit" class="submit-button">Confirm Booking</button>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <section class="footer-container">
      <article class="footer-info">
        <p>&copy; 2026 SoundStudio. All rights reserved.</p>
        <p>Almaty, Kazakhstan | Dark Neon Studio Edition</p>
      </article>
      <nav class="footer-nav">
        <ul>
          <li><a href="services.html">Services</a></li>
          <li><a href="work.html">Portfolio</a></li>
          <li><a href="booking.html">Booking</a></li>
        </ul>
      </nav>
    </section>
  </footer>

</body>
</html>
